<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#15803d">
    <title>Offline - ReUseTrack</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f4f7f5;
            color: #1f2937;
            text-align: center;
            padding: 1.5rem;
        }
        .box { max-width: 380px; }
        .icon { font-size: 4rem; }
        h1 { font-size: 1.4rem; margin: 0.5rem 0; }
        p { color: #6b7280; }
        button {
            background: #15803d;
            color: #fff;
            border: 0;
            border-radius: 10px;
            padding: 0.7rem 1.5rem;
            font-size: 1rem;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">📡</div>
        <h1>You are offline</h1>
        <p>ReUseTrack needs an internet connection to show live containers and deposits.
           Check your connection and try again.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
    <script>
        window.addEventListener('online', function () { location.reload(); });
    </script>
</body>
</html>
