<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ReUseTrack{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">♻ ReUseTrack</a>
            {% if user.is_authenticated %}
                <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center gap-2 mb-0">
                    {% csrf_token %}
                    <span class="text-white">{{ user.first_name|default:user.username }}</span>
                    <button class="btn btn-outline-light btn-sm">Logout</button>
                </form>
            {% endif %}
        </div>
    </nav>
    <div class="container py-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
