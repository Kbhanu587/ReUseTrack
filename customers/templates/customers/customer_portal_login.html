{% extends 'accounts/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="mb-1">Create portal login</h4>
                <p class="text-muted">
                    {{ customer.name }} will log in with their mobile number
                    <strong>{{ customer.phone }}</strong> and this password.
                </p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.non_field_errors }}
                    {{ form.as_p }}
                    <button class="btn btn-success w-100">Create login</button>
                    <a href="{% url 'customer_detail' customer.pk %}" class="btn btn-link w-100 mt-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
